schema: spec-driven

context: |
  PROJECT
  WorkBeat Admin — the one web platform of WorkBeat (D41), a multi-tenant SaaS that lets a company
  see how its own company-owned Windows and macOS devices are used (apps, websites, activity levels,
  optional screenshots) and block unwanted websites. $1 per employee per month; screenshots are a
  paid add-on (PRD "Pricing").

  WHAT THIS REPOSITORY BUILDS (A10)
    One Next.js 14+ app (App Router, TypeScript, Tailwind, shadcn/ui) on Vercel. Company pages for
    company_admin, manager and it_admin; the staff area for super_admin. One sign-in page run by the
    API (POST /v1/auth/login; no Supabase); the UI follows the role (D41). Types and codes come from the backend's
    docs/core/api/portal-api.md and staff-api.md (packages/shared later).

  WHAT THIS REPOSITORY DOES NOT BUILD
  The NestJS API, its database and jobs (WorkBeat-Backend), the agents and the Downloader (their
  own repositories). The API is a CONSUMED contract: its routes, fields, roles and codes are fixed
  in WorkBeat-Backend/docs/openspec. Never specify API behaviour as this repository's work; cite
  the backend capability the page relies on.

  ROLES
    company_admin  everything in the company, including billing and team
    manager        own team only, read only (reports, screenshots, pauses, rules)
    it_admin       deployment, devices, block list, alerts; employee list without reports
    super_admin    staff area only; never employee, device, activity, URL or screenshot data

  DESIGN REFERENCE
  docs/design/reference/workbeat-prototype.html. It fixes look, layout and wording; Plan v3.5 and
  the backend specs fix behaviour. Deviations are listed in docs/design/README.md (A1).

  SOURCE AUTHORITY. Precedence, highest first:
    1. WorkBeat Plan v3.5 (16 Nov 2026)          The source of truth. D1–D48 are its rulings.
    2. WorkBeat-Backend docs/openspec + B1–B21   The API contract the pages consume.
    3. docs/decisions/admin-decisions.md         A1–A12, this repository's rulings.
    4. The prototype                             Look, layout and wording.
    5. WorkBeat PRD (9 Nov 2026)                 Product logic. Amended by 1–3.
  Cite "D<n>", "B<n>", "A<n>", "Plan-v3.5 §n", backend capability names in backticks, and
  "Prototype <page>".

  THE FIVE RULES MOST OFTEN GOT WRONG
  1. Hiding a page is not access control; the API refuses, the page handles 403 (D41).
  2. Staff pages never show employee, device, activity, URL or screenshot data (D41).
  3. There is no reassign: a device changes employee only by release and a new WorkBeat Setup (D48).
  4. There is no MDM: deployment is the Downloader and the licence key only (D40).
  5. No secret or signed URL is logged, stored in the browser or put in a URL (A6).

rules:
  specs:
    - >-
      Every requirement MUST carry an HTML comment immediately under its heading naming its
      sources, in the form: <!-- source: D48 · A7 · backend `device-lifecycle` · Prototype "Devices" -->.
    - Use SHALL or MUST in every requirement statement. Never "should" or "may".
    - Every requirement needs at least one "#### Scenario:" heading, with exactly four hashtags.
    - Keep each requirement statement under 500 characters; split it rather than run over.
    - >-
      Specs state observable behaviour of the web platform: what a page shows to each role, which
      API route it calls, what a control does, what the person sees for each response code. API
      paths, field names and codes ARE allowed. No React component, hook or file names.
    - >-
      API behaviour is never this repository's work. Where a requirement exists because the API
      behaves a certain way, cite the backend capability.
  proposal:
    - The Why section must name the D-number, A-number, Plan-v3.5 section or backend capability that motivates it.
  design:
    - Record which upstream clause or prototype screen each decision amends, and why the newer rule wins.
  tasks:
    - Group tasks by capability; every group ends with its tests, including a role test (each role sees only what it may) where the page shows data.
