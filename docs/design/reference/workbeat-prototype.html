<title>WorkBeat Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: fixed left rail (product areas grouped by who uses them) + scrolling work area; rail becomes a drawer under 900px. */
:root {
  --bg: #F4F6F8; --surface: #FFFFFF; --surface-2: #EBEFF3; --fg: #16202A; --muted: #5A6675; --line: #D9DFE6;
  --accent: #0B6E5F; --accent-fg: #FFFFFF; --accent-soft: #DCEFEA;
  --ok: #1D7F48; --ok-soft: #DDF1E5; --warn: #9A6412; --warn-soft: #F8ECD6; --bad: #B3401A; --bad-soft: #F8E1D8;
  --info: #2457C5; --info-soft: #DFE8FA; --neutral: #8A94A2;
  --prod: #1D7F48; --neu: #9AA4B1; --unprod: #C4572D;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1318; --surface: #151C23; --surface-2: #1C252E; --fg: #E4EAF0; --muted: #91A0B0; --line: #29343F;
  --accent: #39BFA4; --accent-fg: #06221C; --accent-soft: #123A33;
  --ok: #4CC584; --ok-soft: #133524; --warn: #E2AE55; --warn-soft: #3A2C12; --bad: #F08259; --bad-soft: #42221A;
  --info: #79A6FF; --info-soft: #1A2948; --neutral: #6E7B8A;
  --prod: #4CC584; --neu: #6E7B8A; --unprod: #F08259;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1318; --surface: #151C23; --surface-2: #1C252E; --fg: #E4EAF0; --muted: #91A0B0; --line: #29343F;
  --accent: #39BFA4; --accent-fg: #06221C; --accent-soft: #123A33;
  --ok: #4CC584; --ok-soft: #133524; --warn: #E2AE55; --warn-soft: #3A2C12; --bad: #F08259; --bad-soft: #42221A;
  --info: #79A6FF; --info-soft: #1A2948; --neutral: #6E7B8A;
  --prod: #4CC584; --neu: #6E7B8A; --unprod: #F08259;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 22px; font-weight: 600; }
h2 { font-size: 16px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }

/* shell */
.shell { display: grid; grid-template-columns: 248px minmax(0,1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.brand svg { flex: none; }
.brand b { font-family: var(--f-display); font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup .label { padding: 0 10px 6px; }
.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--fg); text-decoration: none; font-weight: 500; }
.nav:hover { background: var(--surface-2); }
.nav.on { background: var(--accent-soft); color: var(--accent); }
.nav .cnt { margin-left: auto; font-size: 11px; background: var(--bad-soft); color: var(--bad); padding: 0 7px; border-radius: 10px; font-weight: 600; }
.nav svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.topbar .host { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); background: var(--surface-2); padding: 3px 9px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.topbar .spacer { flex: 1; }
.rolepick { display: flex; align-items: center; gap: 8px; }
.rolepick select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.iconbtn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.menubtn { display: none; }
.content { padding-block: 22px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1240px; width: 100%; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pagehead p { color: var(--muted); margin-top: 4px; max-width: 70ch; }
.demo-banner { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); padding: 6px 10px; }

/* blocks */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card > h2 + *, .card > .cardhead + * { margin-top: 12px; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-wide { grid-template-columns: minmax(0,2fr) minmax(0,1fr); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--f-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.between { justify-content: space-between; }

/* table */
.tablewrap { overflow-x: auto; margin-inline: -16px; padding-inline: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.who { display: flex; align-items: center; gap: 9px; min-width: 160px; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); flex: none; }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 20px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.p-ok { background: var(--ok-soft); color: var(--ok); }
.p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); }
.p-info { background: var(--info-soft); color: var(--info); }
.p-acc { background: var(--accent-soft); color: var(--accent); }
.tag { font-family: var(--f-mono); font-size: 11.5px; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* buttons + forms */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type=text], input[type=email], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; min-width: 0; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.notice { border-radius: var(--r); padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.notice.info { background: var(--info-soft); color: var(--fg); }
.notice.warn { background: var(--warn-soft); color: var(--fg); }
.notice.ok { background: var(--ok-soft); color: var(--fg); }
.notice b { font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); border-radius: 6px; padding: 3px 4px 3px 9px; font-family: var(--f-mono); font-size: 12px; }
.chip button { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 0 4px; }
.secret { font-family: var(--f-mono); background: var(--surface-2); border: 1px dashed var(--accent); padding: 8px 10px; border-radius: 6px; word-break: break-all; }
.code { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre; }
.confirm { background: var(--bad-soft); border-radius: 6px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* charts */
.bars { display: grid; grid-template-columns: repeat(var(--n), minmax(0,1fr)); gap: 6px; align-items: end; height: 150px; padding-top: 8px; border-bottom: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 25%; background-position: 0 -1px; }
.bars .b { position: relative; background: var(--accent-soft); border-radius: 3px 3px 0 0; min-height: 2px; }
.bars .b i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 3px 3px 0 0; }
.bars-x { display: grid; grid-template-columns: repeat(var(--n), minmax(0,1fr)); gap: 6px; font-size: 11px; color: var(--muted); text-align: center; margin-top: 4px; font-variant-numeric: tabular-nums; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.split span { display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.hbar { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0,1fr) 64px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .t { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; border-radius: 4px; }
.hbar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .dh { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 4px; font-weight: 600; }
.cal .d { border-radius: 6px; padding: 6px; min-height: 64px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
.cal .d.out { background: transparent; }
.cal .d .n1 { color: var(--muted); font-size: 11px; }
.cal .d .h { font-weight: 600; font-variant-numeric: tabular-nums; }
.cal .d.today { outline: 2px solid var(--accent); }

/* screenshots */
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.shot .scr { aspect-ratio: 16/10; background: var(--surface-2); position: relative; padding: 8px; display: flex; flex-direction: column; gap: 5px; max-width: 100%; }
.shot .scr .tb { height: 8px; border-radius: 2px; background: var(--line); width: 100%; }
.shot .scr .ln { height: 5px; border-radius: 2px; background: var(--line); }
.shot .scr .app { position: absolute; left: 8px; bottom: 8px; font-size: 10.5px; font-weight: 600; background: var(--surface); padding: 1px 6px; border-radius: 4px; }
.shot .scr.paused { display: grid; place-items: center; text-align: center; font-size: 12px; color: var(--muted); background: repeating-linear-gradient(45deg, var(--surface-2), var(--surface-2) 6px, var(--surface) 6px, var(--surface) 12px); }
.shot .meta { padding: 6px 8px; font-size: 12px; display: flex; justify-content: space-between; color: var(--muted); }

/* steps / checklist */
.steps { display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; padding: 8px 0; }
.step .c { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.step.done .c { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.step.now .c { border-color: var(--accent); color: var(--accent); }
ol.guide { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
ol.guide li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }

/* tier picker */
.tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tier { border: 1.5px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; background: var(--surface); text-align: left; display: flex; flex-direction: column; gap: 3px; }
.tier.on { border-color: var(--accent); background: var(--accent-soft); }
.tier .pr { font-family: var(--f-display); font-size: 18px; font-weight: 600; }

/* device mocks */
.mock-desk { background: linear-gradient(160deg, #3A5568, #1E2E3B); border-radius: 10px; padding: 0 0 18px; min-height: 340px; position: relative; overflow: hidden; color: #E9EEF2; }
.mac-bar { height: 26px; background: rgba(20,28,36,.55); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px; font-size: 12px; }
.mac-bar .wb { display: inline-flex; align-items: center; gap: 4px; background: rgba(255,255,255,.18); padding: 1px 6px; border-radius: 4px; }
.pop { background: #F7F8FA; color: #16202A; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.35); width: min(300px, calc(100% - 24px)); font-size: 13px; overflow: hidden; }
.pop .ph { padding: 12px 14px; border-bottom: 1px solid #E1E5EA; display: flex; gap: 10px; align-items: center; }
.pop .pi { padding: 4px 0; }
.pop .pr2 { padding: 6px 14px; display: flex; justify-content: space-between; gap: 10px; }
.pop .pr2 span:last-child { color: #5A6675; }
.pop .sep { height: 1px; background: #E1E5EA; margin: 4px 0; }
.pop .lnk { padding: 6px 14px; color: #0B6E5F; }
.pop .foot { padding: 8px 14px; font-size: 11.5px; color: #5A6675; background: #EEF1F4; }
.mac-pop { position: absolute; right: 12px; top: 32px; }
.win-task { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: rgba(16,22,28,.85); display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; gap: 12px; font-size: 12px; }
.win-pop { position: absolute; right: 12px; bottom: 46px; }
.dlg { background: #F7F8FA; color: #16202A; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.35); width: min(380px, calc(100% - 24px)); padding: 18px; margin: 40px auto 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.dlg h3 { font-size: 15px; }
.dlg .btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dlg .b1 { background: #0B6E5F; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.dlg .b2 { background: #fff; color: #16202A; border: 1px solid #C9D0D8; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.browser .chrome { background: var(--surface-2); padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
.browser .url { flex: 1; min-width: 0; background: var(--surface); border-radius: 14px; padding: 4px 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blocked { padding: 48px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.blocked .ic { width: 56px; height: 56px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); display: grid; place-items: center; }
.term { background: #0F151B; color: #CFE3DC; font-family: var(--f-mono); font-size: 12.5px; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px); }
.scrim { display: none; }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g-wide { grid-template-columns: minmax(0,1fr); } }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 270px; z-index: 30; transform: translateX(-100%); transition: transform .2s; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
  .shell.open .rail { transform: none; }
  .shell.open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; }
  .menubtn { display: inline-flex; }
  .g2, .g3 { grid-template-columns: minmax(0,1fr); }
}
@media (max-width: 560px) { .g4 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .topbar .host { display: none; } .hbar { grid-template-columns: 90px minmax(0,1fr) 54px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* lists: search, filters, pagination */
input[type=search], input[type=date], input[type=time] { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; }
input[type=search] { width: 100%; }
input:disabled { opacity: .5; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .search { max-width: 300px; flex: 1 1 200px; }
.toolbar select { width: auto; }
.rangepick { gap: 8px; }
.rangepick select, .rangepick input { width: auto; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 12px; font-size: 12.5px; color: var(--muted); }
.pager .pgs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.pager .btn { min-width: 30px; justify-content: center; }

  <div class="card"><h2>Devices</h2><div class="tablewrap"><table><thead><tr><th>Device</th><th>Status</th><th>Agent</th><th>Helper</th><th>Permissions</th><th>Last seen</th></tr></thead><tbody>
    ${ds.map(d => `<tr><td><span class="mono">${esc(d.host)}</span><div class="small muted">${d.os} · ${d.via}</div></td><td>${statusPill(d.status)}</td><td class="mono">${d.ver}${d.ver < S.minVer ? ' <span class="pill p-warn">Outdated</span>' : ''}</td><td>${d.helper ? '<span class="pill p-ok">Running</span>' : '<span class="pill">Stopped</span>'}</td><td>${d.perms === 'ok' ? '<span class="pill p-ok">Granted</span>' : '<span class="pill p-info">Screen Recording pending</span>'}</td><td class="small muted">${d.seen}</td></tr>`).join('') || emptyRow(6, 'No device linked.')}

// Hourly chart on a fixed 0–60 minute scale: full bar = minutes the computer was on, dark part = minutes with keyboard or mouse use.
function hourChart(hours) {
  const best = hours.reduce((b, h) => h.sec * h.act > (b ? b.sec * b.act : -1) ? h : b, null);
  return `<div class="hchart"><div class="yaxis" aria-hidden="true"><span>60m</span><span>45m</span><span>30m</span><span>15m</span><span>0</span></div>
    <div><div class="bars" style="--n:${hours.length}" role="img" aria-label="Minutes active per hour">${hours.map(h => `<div class="b" style="height:${Math.min(100, h.sec / 36)}%" title="${pad(h.h)}:00–${pad(h.h + 1)}:00 · ${hm(h.sec)} on · ${hm(h.sec * h.act)} active${h.paused ? ' · paused' : ''}"><i style="height:${h.act * 100}%"></i></div>`).join('')}</div>
    <div class="bars-x" style="--n:${hours.length}">${hours.map(h => `<span>${pad(h.h)}:00</span>`).join('')}</div><div class="small muted" style="text-align:center">Time of day (each bar is one hour, e.g. 09:00 = 09:00–10:00)</div></div></div>
    <div class="legend" style="margin-top:8px"><span><i style="background:var(--accent)"></i>Active: keyboard or mouse used</span><span><i style="background:var(--accent-soft)"></i>Computer on, no input (idle)</span>${best && best.sec ? `<span>Busiest hour: <b>${pad(best.h)}:00</b>, ${hm(best.sec * best.act)} active</span>` : ''}</div>`;
}
const defaultRep = () => ({ show: { summary: true, hourly: true, daily: true, apps: true, sites: true }, top: 8, cat: 'all', group: 'day', compare: false });
S.rep = defaultRep();
function breakdown(e, days, by) {
  const g = new Map();
  for (const d of days) { const k = by === 'day' ? iso(d) : by === 'week' ? iso(monday(d)) : iso(new Date(d.getFullYear(), d.getMonth(), 1)); if (!g.has(k)) g.set(k, []); g.get(k).push(d); }
  return [...g].map(([k, ds]) => {
    const a = aggregate(e, ds), d0 = pd(k);
    const label = by === 'day' ? fD(d0) : by === 'week' ? `Week of ${fD(d0, { day: 'numeric', month: 'short' })}` : fD(d0, { month: 'long', year: 'numeric' });
    const paused = ds.some(d => pausesOnDay(e.id, d).length), weekend = by === 'day' && (d0.getDay() === 0 || d0.getDay() === 6);
    return { k, label, a, note: paused ? 'Monitoring paused' : weekend ? 'Weekend' : !a.days ? 'No activity' : '' };
  }).reverse();
}

  const topList = (obj, kind) => { let x = Object.entries(obj).filter(([n]) => kind === 'domain' || n !== 'Chrome' || true).filter(([n]) => R.cat === 'all' || catOf(kind, n) === R.cat).sort((p, q) => q[1] - p[1]); if (R.top !== 'all') x = x.slice(0, +R.top); return x; };
  const apps = topList(a.apps, 'app'), sites = topList(a.sites, 'domain');
  const hbars = (list, kind) => { const mx = list[0]?.[1] || 1; return list.map(([n, v]) => { const c = catOf(kind, n); return `<div class="hbar"><span class="row ${kind === 'domain' ? 'mono' : ''}" style="gap:6px;flex-wrap:nowrap;min-width:0"><span class="dot" style="background:${CATCOL[c]}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(n)}">${esc(n)}</span></span><span class="t"><i style="width:${v / mx * 100}%;background:${CATCOL[c]}"></i></span><span class="n">${hm(v)}</span></div>`; }).join('') || '<p class="small muted">Nothing in this category.</p>'; };
  const maxH = Math.max(1, ...a.hourly.map(h => h.avg));
  const bd = breakdown(e, days, R.group), L = lst('repbd', bd, r => r.label + ' ' + r.note);
  const cust = S.repCust ? `<div class="card stack noprint"><div class="cardhead"><h2>Customize report</h2><button class="btn sm" data-act="represet">Reset to default</button></div>
      <div class="checks">${[['summary', 'Summary cards'], ['hourly', 'Activity by hour'], ['daily', 'Breakdown table'], ['apps', 'Applications'], ['sites', 'Websites']].map(([k, l]) => `<label><input type="checkbox" data-act-change="repshow" data-k="${k}" ${R.show[k] ? 'checked' : ''}> ${l}</label>`).join('')}</div>
      <div class="form">
        <div class="field"><label for="rep-top">Apps and sites to list</label><select id="rep-top" data-act-change="reptop">${[['5', 'Top 5'], ['8', 'Top 8'], ['15', 'Top 15'], ['all', 'All']].map(([v, l]) => `<option value="${v}" ${String(R.top) === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label for="rep-cat">Category</label><select id="rep-cat" data-act-change="repcat">${['all', 'productive', 'neutral', 'unproductive'].map(v => `<option value="${v}" ${R.cat === v ? 'selected' : ''}>${v === 'all' ? 'All categories' : cap(v) + ' only'}</option>`).join('')}</select></div>

function reportCSV(e) {

function empCalendar(e) {

  let title = '', body = '', prevOk, nextOk;

    prevOk = addD(first, -1) >= minDate(); nextOk = addD(last, 1) <= TODAY; title = fD(first, { month: 'long', year: 'numeric' });
    let cells = ''; for (let i = 0; i < lead; i++) cells += '<div class="d out"></div>';
    for (let n = 1; n <= last.getDate(); n++) {
      const day = new Date(d.getFullYear(), d.getMonth(), n), u = dayUsage(e, day), gone = day < minDate(), fut = day > TODAY, paused = pausesOnDay(e.id, day).length;
      const lvl = u ? Math.min(1, u.total / 32400) : 0;

      const top = u ? Object.entries(u.apps).sort((p, q) => q[1] - p[1]).slice(0, 3) : [];

  } else {
    const u = dayUsage(e, d), tl = timeline(e, d);
    prevOk = addD(d, -1) >= minDate(); nextOk = addD(d, 1) <= TODAY; title = fD(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const maxH = Math.max(1, ...(u ? u.hourly.map(h => h.tracked) : [1]));
    body = `<div class="stack"><h3>Status</h3>${tlBar(tl)}${tlLegend}</div>` + (u ? `<div class="grid g2"><div class="stack"><h3>Hours · ${hm(u.total)} tracked, ${pct(u.active)} active</h3>${hourChart(u.hourly.map(h => ({ h: h.h, sec: h.tracked, act: h.act, paused: h.paused })))}</div>
      <div class="stack"><h3>Top apps</h3>${Object.entries(u.apps).sort((p, q) => q[1] - p[1]).slice(0, 5).map(([n, v]) => `<div class="row between small"><span class="row" style="gap:6px"><span class="dot" style="background:${CATCOL[catOf('app', n)]}"></span>${n}</span><span class="num muted">${hm(v)}</span></div>`).join('')}</div></div>
      <div class="row"><button class="btn" data-act="dayshots" data-v="${iso(d)}">Screenshots for this day</button><button class="btn" data-act="dayreport" data-v="${iso(d)}">Open in report</button></div>`

function timesheetRows(e) {

}

const STEP = { light: 60, standard: 30, intensive: 10 }; // fastest interval each plan allows, in minutes
// Interval actually used: the admin's choice, never faster than the plan allows; 0 = off.
const shotMin = () => S.tier === 'off' || S.shotEvery === 0 ? 0 : Math.max(STEP[S.tier], S.shotEvery || STEP[S.tier]);
const everyTxt = m => m % 60 === 0 ? (m === 60 ? 'every hour' : `every ${m / 60} hours`) : `every ${m} minutes`;
function shotsFor(e, d) {
  if (!shotMin() || !dayUsage(e, d)) return [];
  const step = shotMin(), r = rng(hash(e.id + 'shots' + iso(d))), end = sameDay(d, TODAY) ? NOW : at(d, 17, 30), out = [];
  let n = 0;
  for (let m = 9 * 60; ; m += step) {
    const t = at(d, 0, m); if (t > end) break;
    const p = pauseAt(e.id, t);
    if (p) { const l = out[out.length - 1]; if (l && l.kind === 'paused') l.until = t; else out.push({ t, kind: 'paused', until: t }); continue; }
    if (t.getHours() === 13 && step < 60) { out.push({ t, kind: 'lunch' }); continue; }
    n++; if (n % 9 === 4) { out.push({ t, kind: 'sensitive' }); continue; }
    const app = APPS[Math.floor(r() * 7)];
    out.push({ t, kind: 'shot', app, title: TITLES[app], kb: Math.round(240 + r() * 120), seed: Math.floor(r() * 1e9), host: devsOf(e.id)[0]?.host || '—' });
  }
  return out;
}
const shotLines = (seed, n, cls = 'ln') => { const r = rng(seed); return Array.from({ length: n }, () => `<div class="${cls}" style="width:${40 + r() * 55}%"></div>`).join(''); };
function empShots(e) {
  if (!shotMin()) return `<div class="card stack" style="align-items:flex-start"><h2>Screenshots are off</h2><p class="muted">${S.tier === 'off' ? 'Your company’s plan doesn’t include screenshots. Contact WorkBeat to add them.' : 'Your Company Admin has turned screenshots off in Company settings.'}</p>${S.role === 'admin' && S.tier !== 'off' ? '<a class="btn pri" href="#company">Open company settings</a>' : ''}</div>`;
  const d = pd(S.shotDate), all = shotsFor(e, d), real = all.filter(s => s.kind === 'shot');
  const appsHere = [...new Set(real.map(s => s.app))].sort();
  const filtered = S.shotApp === 'all' ? all : all.filter(s => s.app === S.shotApp);
  const L = lst('shots', filtered, s => (s.app || '') + ' ' + (s.title || '') + ' ' + hhmm(s.t), 24, [12, 24, 48]);
  const pz = pausesOnDay(e.id, d);
  const tile = s => {
    if (s.kind === 'paused') return `<div class="shot"><div class="scr paused">Monitoring paused<br>${hhmm(s.t)}–${hhmm(new Date(+s.until + shotMin() * 6e4))}</div><div class="meta"><span>${hhmm(s.t)}</span><span>paused</span></div></div>`;
    if (s.kind === 'lunch') return `<div class="shot"><div class="scr paused">Lunch break<br>no activity</div><div class="meta"><span>${hhmm(s.t)}</span><span>skipped</span></div></div>`;
    if (s.kind === 'sensitive') return `<div class="shot"><div class="scr paused">Paused<br>sensitive site open</div><div class="meta"><span>${hhmm(s.t)}</span><span>excluded</span></div></div>`;
    return `<button class="shot" style="padding:0;cursor:pointer;text-align:left" data-act="openshot" data-v="${real.indexOf(s)}" aria-label="Screenshot at ${hhmm(s.t)}, ${esc(s.app)}"><div class="scr"><div class="tb"></div>${shotLines(s.seed, 4)}<span class="app">${esc(s.app)}</span></div><div class="meta"><span>${hhmm(s.t)}</span><span>${s.kb} KB</span></div></button>`;
  };
  return `<div class="notice info"><div><b>One screenshot ${everyTxt(shotMin())}.</b> Kept for ${S.retention} days, so the earliest date you can open is ${fDY(minDate())}. Only Company Admins and this person's manager can see them.</div></div>
    <div class="card stack"><div class="cardhead"><h2>${fD(d, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</h2>${dayNav('shotnav', S.shotDate, 'Screenshot date')}</div>
      <div class="toolbar">${L.search('Search app or window title')}<select data-act-change="shotapp" aria-label="Filter by app"><option value="all">All apps</option>${appsHere.map(a => `<option ${S.shotApp === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select><span class="small muted">${real.length} captures this day</span></div>
      ${pz.length ? `<div class="notice info"><div>Monitoring paused: ${pz.map(p => `${esc(p.reason)} (${pauseRange(p)})`).join('; ')}. Nothing was captured during that time.</div></div>` : ''}
      ${L.rows.length ? `<div class="shots">${L.rows.map(tile).join('')}</div>${L.pager()}` : `<p class="muted">${!dayUsage(e, d) ? (pz.length ? 'Monitoring was paused all day.' : d.getDay() % 6 === 0 ? 'Weekend: no activity, so no screenshots.' : 'No activity this day, so no screenshots.') : 'No screenshots match this filter.'}</p>`}
    </div>`;
}

    rmsens: () => { S.sensitive = S.sensitive.filter(s => s !== v); render(); toast(`${v} removed from sensitive sites`); },
    rmprod: () => { S.prod = S.prod.filter(r => r.id !== id); S.confirm = null; render(); toast('Rule deleted. Reports recalculated.'); },
    method: () => { S.installMethod = v; render(); },
    guide: () => { S.guide = v; render(); },
    dlfile: () => download(...fileBody(FILES[+v])),
    dlsetup: () => download(...fileBody([v === 'win' ? 'WorkBeatSetup.exe' : 'WorkBeatSetup.pkg', '', '', 'bin'])),
    copylic: () => { const k = S.companies[0].key; navigator.clipboard?.writeText(k).then(() => toast('License key copied'), () => { S.showLic = true; render(); toast('Select the key and press Ctrl+C or ⌘C'); }); },
    copy: () => { const t = $('#' + el.dataset.target).textContent; navigator.clipboard?.writeText(t).then(() => toast('Copied'), () => { const r = document.createRange(); r.selectNodeContents($('#' + el.dataset.target)); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Press Ctrl+C or ⌘C to copy'); }); },
    // team
    resend: () => { USERS.find(u => u.id === id).sent = 'today'; render(); toast('Invite email sent again'); },
    rmuser: () => { const u = USERS.find(x => x.id === id); USERS.splice(USERS.indexOf(u), 1); EMP.forEach(e2 => { if (e2.mgr === u.id) e2.mgr = null; }); if (S.assignMgr === u.id) S.assignMgr = USERS.find(x => x.role === 'manager' && !x.pending)?.id; S.confirm = null; render(); toast(u.pending ? 'Invite cancelled' : `${u.name} can no longer sign in`); },
    // company
    shotpick: () => { $('#sh-min').value = v; $('#sh-min').disabled = false; $('#sh-on').checked = true; },
    verifydomain: () => { const D = S.domain; D.check = 'just now'; if (D.tries++ < 1) { render(); toast('Records not found yet. If you just added them, wait a few minutes and check again.'); return; } D.status = 'active'; render(); toast('Both records found. Your custom domain is live.'); },
    rmdomain: () => { S.domain = null; S.confirm = null; render(); toast('Custom domain removed.'); },
    noticetpl: () => download(`${slugify(S.co.name)}-monitoring-notice.txt`, noticeText()),
    invoice: () => download(`${v}.txt`, `${v}\n${S.co.name}\nWorkBeat Growth plan\n\n${DEVICES.length} seats x $1.00 = $${DEVICES.length.toFixed(2)}\nScreenshots ${TIERS[S.tier].name}: ${DEVICES.length} x $${TIERS[S.tier].add.toFixed(2)}\nTotal: $${(DEVICES.length * (1 + TIERS[S.tier].add)).toFixed(2)}\nPaid by Visa ending ${S.card.last4}\n`),
    // super admin
    suspend: () => { const c = S.companies.find(c => c.id === id); c.status = c.status === 'suspended' ? 'active' : 'suspended'; S.confirm = null; render(); toast(`${c.name} ${c.status === 'suspended' ? 'suspended' : 'restored'}.`); },
    reissuego: () => { const c = S.companies.find(x => x.id === S.modal.id); c.key = genKey(Date.now() % 1e9); S.modal.newKey = c.key; renderModal(); render(); },
    recheck: () => { const d = S.domain?.name === v ? S.domain : S.domains.find(x => x.name === v); d.check = 'just now'; render(); toast(d.status === 'missing' ? 'TXT record still not found.' : 'Still waiting for DNS. The customer hasn’t added the records yet.'); },
  };
  if (acts[a]) { if (el.tagName === 'A') e.preventDefault(); acts[a](); }
});
document.addEventListener('keydown', e => {
  if (!S.modal) return;
  if (e.key === 'Escape') closeModal();
  if (S.modal?.t === 'shot' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const n = shotsFor(emp(S.emp), pd(S.shotDate)).filter(s => s.kind === 'shot').length; S.modal.i = Math.max(0, Math.min(n - 1, S.modal.i + (e.key === 'ArrowLeft' ? -1 : 1))); renderModal(); }
});
document.addEventListener('change', e => {
  const el = e.target, a = el.dataset.actChange; if (!a) return;
  const R = S.rep;
  if (a === 'preset') { S.preset = el.value; if (el.value !== 'custom') setRange(...presetRange(el.value)); S.pg.repbd = 1; render(); }
  if ((a === 'rfrom' || a === 'rto') && el.value) { S.preset = 'custom'; setRange(pd(a === 'rfrom' ? el.value : S.from), pd(a === 'rto' ? el.value : S.to)); S.pg.repbd = 1; render(); }
  if (a === 'pagesize') { S.ps[el.dataset.k] = +el.value; S.pg[el.dataset.k] = 1; render(); }
  if (a === 'dept') { S.dept = el.value; S.pg.employees = 1; render(); }
  if (a === 'repshow') { R.show[el.dataset.k] = el.checked; render(); }
  if (a === 'reptop') { R.top = el.value; render(); }
  if (a === 'repcat') { R.cat = el.value; render(); }
  if (a === 'repgroup') { R.group = el.value; S.pg.repbd = 1; render(); }
  if (a === 'repcmp') { R.compare = el.checked; render(); }
  if ((a === 'shotnav' || a === 'stnav') && el.value) { const d = pd(el.value), k = a === 'shotnav' ? 'shotDate' : 'stDate'; S[k] = iso(d < minDate() ? minDate() : d > TODAY ? TODAY : d); S.pg[a === 'shotnav' ? 'shots' : 'stlog'] = 1; render(); }
  if (a === 'alertfilt') { S.f.alerts = el.value; S.pg.alerts = 1; render(); }
  if (a === 'shotapp') { S.shotApp = el.value; S.pg.shots = 1; render(); }
  if (a === 'pzopen') { $('#pz-td').disabled = $('#pz-tt').disabled = el.checked; }
  if (a === 'impfile' && el.files[0]) { if (el.files[0].size > 1e6) { merr('That file is over 1 MB. Split it into smaller files.'); return; } const fr = new FileReader(); fr.onload = () => { $('#imp-text').value = fr.result; $('#imp-go').disabled = true; merr(''); }; fr.readAsText(el.files[0]); }
  if (a === 'mgr') { S.assignMgr = el.value; render(); }
  if (a === 'teamtick') { const e2 = emp(el.dataset.id); e2.mgr = el.checked ? S.assignMgr : null; render(); toast(el.checked ? `${e2.name} added to team` : `${e2.name} removed from team`); }
  if (a === 'userrole') { const u = USERS.find(x => x.id === el.dataset.id); u.role = el.value; if (u.role !== 'manager') EMP.forEach(e2 => { if (e2.mgr === u.id) e2.mgr = null; }); render(); toast(`${u.name} is now ${el.selectedOptions[0].text}`); }
  if (a === 'prodcat') { S.prod.find(r => r.id === el.dataset.id).cat = el.value; render(); toast('Rule updated. Reports recalculated.'); }
  if (a === 'minver') { S.minVer = el.value; render(); }
  if (a === 'shon') { $('#sh-min').disabled = !el.checked; }
  if (a === 'guide') { S.guide = el.value; render(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.q; if (k != null) { S.q[k] = e.target.value; S.pg[k] = 1; render(); return; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form, val = id => $('#' + id).value.trim();
  if (f === 'addblock') {
    const type = document.querySelector('[name=bl-type]:checked').value, p = val('bl-pat');
    if (type === 'url' && !/^([a-z0-9-]+\.)+[a-z]{2,}\/\S+$/i.test(p)) return merr('Type the website and the part to block, like youtube.com/shorts.');
    if (type === 'domain' && !/^([a-z0-9-]+\.)+[a-z]{2,}$/i.test(p)) return merr('Type just the website, like facebook.com, without http:// or anything after a /.');
    if (S.block.some(b => b.type === type && b.pattern.toLowerCase() === p.toLowerCase())) return merr('That rule already exists.');
    S.block.unshift({ id: uid(), type, pattern: p, reason: val('bl-why') || '—', by: ME[S.role].name }); closeModal(); render(); toast('Blocked. Computers update within 30 minutes.');
  }
  if (f === 'addsens') { const x = val('sens-new').toLowerCase(); if (!/^(\*\.)?([a-z0-9-]+\.)+[a-z]{2,}$/i.test(x)) return merr('Type just the website, like citybank.com.'); if (S.sensitive.includes(x)) return merr('That site is already on the list.'); S.sensitive.unshift(x); closeModal(); render(); toast(`${x} will never be recorded`); }
  if (f === 'addprod') { const p = val('pr-p'), m = val('pr-m'); if (S.prod.some(r => r.match === m && r.pattern.toLowerCase() === p.toLowerCase())) return merr('A rule for that already exists. Change its category in the list.'); S.prod.push({ id: uid(), match: m, pattern: p, cat: val('pr-c') }); closeModal(); render(); toast('Rule added. Reports updated.'); }
  if (f === 'invite') { const em = val('iv-email').toLowerCase(); if (!EMAIL_RE.test(em)) return merr('Enter a valid email.'); if (USERS.some(u => u.email.toLowerCase() === em)) return merr('That person already has access or an invite.'); USERS.push({ id: uid(), name: em.split('@')[0], email: em, role: document.querySelector('[name=iv-role]:checked').value, pending: true, sent: 'today' }); closeModal(); render(); toast(`Invite sent to ${em}`); }
  if (f === 'domain') {
    const n = val('dm-name').toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    // shortcut: "needs 3+ labels" treats two-part endings like .com.bd as a subdomain; use a public-suffix list in the real app
    if (!/^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.){2,}[a-z]{2,}$/.test(n)) return merr('Type an address with a part in front, like monitor.nagorik.tech.');
    if (n.endsWith('workbeat.io')) return merr('Use your own company’s domain, not workbeat.io.');
    if (S.domain && S.domain.name === n) { closeModal(); return; }
    S.domain = { name: n, status: 'pending', token: uid(), check: 'not yet', tries: 0 }; closeModal(); render(); toast('Saved. Now add the two DNS records shown.');
  }
  if (f === 'shots') {
    if (!$('#sh-on').checked) { S.shotEvery = 0; render(); toast('Screenshots turned off. Computers stop within 30 minutes.'); return; }
    const m = Number(val('sh-min')), lo = STEP[S.tier];
    if (!Number.isInteger(m) || m > 480) { toast('Enter a whole number of minutes, up to 480.'); return; }
    if (m < lo) { toast(`Your plan allows one screenshot every ${lo} minutes at most. Enter ${lo} or more.`); return; }
    S.shotEvery = m; render(); toast(`Saved: one screenshot ${everyTxt(m)}.`);
  }
  if (f === 'reassign') {
    const d = dev(S.modal.id), prev = emp(d.emp), to = val('ra-emp');
    if (!to) return merr('Choose who gets this device.');
    d.emp = to;
    UC.clear(); closeModal(); render(); toast(`${d.host} now belongs to ${emp(to).name}. Earlier activity stays with ${prev ? prev.name : 'the previous person'}.`);
  }
  if (f === 'addemp') {
    const em = val('ne-email').toLowerCase(), name = val('ne-name'), dept = val('ne-dept');
    if (!name) return merr('Enter a name.');
    if (!EMAIL_RE.test(em)) return merr('Enter a valid work email.');
    if (EMP.some(x => x.email.toLowerCase() === em)) return merr('An employee with that email already exists.');
    if (!dept) return merr('Enter a department.');
    const e2 = { id: uid(), name, email: em, dept, mgr: val('ne-mgr') || null, since: TODAY }; EMP.push(e2);
    closeModal(); render(); toast(`${name} added. Install WorkBeat on their computer and pick them in the installer.`);
  }
  if (f === 'company') { const n = val('co-name'); if (!n) { toast('Company name can’t be empty.'); return; } const ret = +val('co-ret'); S.co.name = n; S.companies[0].name = n; if (ret !== S.retention) { S.retention = ret; UC.clear(); setRange(pd(S.from), pd(S.to)); } render(); toast('Company settings saved'); }
  if (f === 'pause') {
    const e2 = emp(S.emp), from = new Date(`${val('pz-fd')}T${val('pz-ft')}`), open = $('#pz-open').checked, to = open ? null : new Date(`${val('pz-td')}T${val('pz-tt')}`);
    if (isNaN(from)) return merr('Pick a start date and time.');
    if (from < new Date(+NOW - 6e4)) return merr('The start can’t be in the past. Data already collected stays until the retention limit.');
    if (!open && (isNaN(to) || to <= from)) return merr('The end must be after the start.');
    const clash = S.pauses.find(p => p.emp === e2.id && !p.cancelled && pState(p) !== 'ended' && from < (p.to || Infinity) && (to === null || to > p.from));
    if (clash) return merr(`This overlaps another pause (${pauseRange(clash)}). End or cancel that one first.`);
    S.pauses.push({ id: uid(), emp: e2.id, from: from < NOW ? new Date(+NOW) : from, to, reason: val('pz-r'), note: val('pz-n'), by: ME[S.role].name });
    UC.clear(); closeModal(); S.empTab = 'pauses'; render(); toast(from <= NOW ? `Monitoring paused for ${e2.name}. Devices stop collecting within a minute.` : `Pause scheduled for ${fDT(from)}.`);
  }
  if (f === 'editemp') {
    const e2 = emp(S.emp), em = val('ee-email').toLowerCase();
    if (!EMAIL_RE.test(em)) return merr('Enter a valid email.');
    if (EMP.some(x => x !== e2 && x.email.toLowerCase() === em)) return merr('Another employee already uses that email.');
    Object.assign(e2, { name: val('ee-name'), email: em, dept: val('ee-dept'), mgr: val('ee-mgr') || null }); closeModal(); render(); toast('Employee updated');
  }
  if (f === 'mail') {
    const types = [...document.querySelectorAll('[name=am-type]:checked')].map(x => x.value);
    const sel = { admin: $('#am-admin').checked, it: $('#am-it').checked, manager: $('#am-manager').checked };
    if (!sel.admin && !sel.it && !sel.manager) return merr('Pick at least one group, or tamper alerts will go unseen.');
    if (!types.length) return merr('Pick at least one alert type.');
    S.alertMail = { ...sel, types, when: val('am-when') }; closeModal(); render(); toast('Alert email settings saved');
  }
  if (f === 'card') {
    const num = val('cd-num').replace(/\s+/g, ''), exp = val('cd-exp'), mail = val('cd-mail');
    if (!/^\d{16}$/.test(num)) return merr('Card number must be 16 digits.');
    const m = exp.match(/^(0[1-9]|1[0-2])\/(\d\d)$/); if (!m || (+m[2] < 26 || (+m[2] === 26 && +m[1] < 11))) return merr('Expiry must be MM/YY and in the future.');
    if (!EMAIL_RE.test(mail)) return merr('Enter a valid billing email.');
    S.card = { last4: num.slice(-4), exp, email: mail }; renderModal(); render(); toast('Card updated');
  }
  if (f === 'plan') {
    const c = S.companies.find(x => x.id === S.modal.id), plan = val('pl-plan'), lim = val('pl-lim');
    if (!lim && plan !== 'Enterprise') return merr('Starter and Growth need a seat limit.');
    if (lim && (+lim < coSeats(c))) return merr(`The limit can’t be below the ${coSeats(c)} seats in use.`);
    Object.assign(c, { plan, limit: lim ? +lim : '∞', tier: val('pl-tier') }); if (c.id === 'c1') S.tier = c.tier.toLowerCase(); closeModal(); render(); toast(`${c.name} updated`);
  }
  if (f === 'publish') {
    const plat = val('rl-plat'), ver = val('rl-ver'), file = $('#rl-file').files[0];
    if (!/^\d+\.\d+\.\d+$/.test(ver)) return merr('Version must look like 1.0.5.');
    const cur = S.releases.filter(r => r.plat === plat).map(r => r.ver).sort(verCmp).pop();
    if (cur && verCmp(ver, cur) <= 0) return merr(`Version must be higher than ${plat}'s current ${cur}.`);
    if (!file || !file.name.toLowerCase().endsWith(plat === 'Windows' ? '.msi' : '.pkg')) return merr(`Choose a signed ${plat === 'Windows' ? '.msi' : '.pkg'} file.`);
    S.releases.forEach(r => { if (r.plat === plat && r.status === 'Current') r.status = 'Supported'; });
    S.releases.unshift({ plat, ver, date: fDY(TODAY), status: 'Current' }); closeModal(); render(); toast(`${plat} ${ver} published. Devices update on their next check.`);
  }

});

// ---------------- self-check (runs once in the console) ----------------
(function selfTest() {
  const ok = console.assert;
  ok(JSON.stringify(parseCSV('a,"b,c"\r\n"x""y",z\n')) === JSON.stringify([['a', 'b,c'], ['x"y', 'z']]), 'parseCSV quotes');
  ok(csvCell('=SUM(A1)') === "'=SUM(A1)" && csvCell('a,b') === '"a,b"', 'csvCell guards formulas and commas');
  ok(iso(presetRange('lastweek')[0]) === '2026-11-02' && iso(presetRange('lastweek')[1]) === '2026-11-08', 'last week is Mon–Sun');
  ok(!!pauseAt('e9', NOW) && !pauseAt('e9', new Date(2026, 10, 14, 0, 0)), 'pause end is exclusive');
  ok(dayUsage(emp('e9'), TODAY) === null, 'fully paused day has no data');
  ok(slugify('Bayside Dental Group!!') === 'bayside-dental-group', 'slugify');
  ok(verCmp('1.0.10', '1.0.9') > 0, 'version compare is numeric');
  { const p = makePDF([{ x: 1, y: 1, t: 'a (b) – c' }]), x = +p.match(/startxref\n(\d+)/)[1]; ok(p.startsWith('%PDF-1.4') && p.slice(x, x + 4) === 'xref' && p.includes('(a \\(b\\) - c)'), 'pdf xref offset and escaping'); }
})();

try { const t = localStorage.getItem('wb-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
setRange(...presetRange('thisweek'));
S.route = location.hash.slice(1) || 'overview';
